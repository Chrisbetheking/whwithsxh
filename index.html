<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端重点：禁止缩放，保证 1:1 布局 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FF6B9D">
<title>王鸿 &amp; 宋星禾 · 我们的小宇宙</title>

<!-- Leaflet 地图样式（OpenStreetMap 免费瓦片） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
/* ============================================================
   王鸿 & 宋星禾 · 我们的纪念页
   ------------------------------------------------------------
   纯前端单页：不依赖任何后端服务，双击即可打开。
   所有内容都在本文件里，想改文字直接搜索关键词即可。
   配色：主色渐变 #FF6B9D → #A66BFF
   ============================================================ */

/* ---------- 全局变量 ---------- */
:root{
  --pink:#FF6B9D;
  --purple:#A66BFF;
  --grad:linear-gradient(135deg,#FF6B9D 0%,#A66BFF 100%);
  --glass:rgba(255,255,255,0.15);       /* 玻璃拟态卡片 */
  --glass-border:rgba(255,255,255,0.35);
  --shadow:0 8px 32px rgba(255,107,157,0.15);
  --text:#fff;
  --radius-card:16px;
  --radius-btn:12px;
}

/* ---------- 基础重置 ---------- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html{scroll-behavior:smooth;}

body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--grad);
  background-attachment:fixed;
  color:#fff;
  overflow-x:hidden;                    /* 移动端重点：禁止横向滚动 */
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* 输入框/按钮统一 16px，防止 iOS 聚焦时自动缩放 */
input,textarea,select,button{font-family:inherit;font-size:16px;}

/* ---------- 爱心飘落层 ---------- */
#heartsLayer{
  position:fixed;
  inset:0;
  z-index:0;                            /* 在内容之下 */
  pointer-events:none;                  /* 不挡点击 */
  overflow:hidden;
}
.fall-heart{
  position:absolute;
  top:-32px;
  will-change:transform,opacity;
  user-select:none;
}

/* ---------- 页面容器 ---------- */
.page{
  position:relative;
  z-index:1;
  max-width:720px;
  margin:0 auto;
  padding:calc(52px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
}

/* ============================================================
   一、首屏：名字 + 在一起倒计时
   ============================================================ */
.hero{text-align:center;margin-bottom:34px;}

.hero-heart{
  font-size:44px;
  line-height:1;
  margin-bottom:14px;
  animation:beat 1.6s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1);}
  12%{transform:scale(1.18);}
  24%{transform:scale(1);}
  36%{transform:scale(1.12);}
  48%{transform:scale(1);}
}

.hero-names{
  font-size:26px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:12px;
  text-shadow:0 3px 16px rgba(0,0,0,.16);
}
.hero-names .amp{
  font-size:20px;
  opacity:.9;
  margin:0 6px;
}

/* 打字机副标题 */
.hero-sub{
  font-size:14px;
  letter-spacing:2px;
  color:rgba(255,255,255,.88);
  min-height:22px;                      /* 预留高度，避免跳动 */
}
.type-cursor{
  display:inline-block;
  width:2px;
  height:14px;
  margin-left:2px;
  vertical-align:-2px;
  background:rgba(255,255,255,.9);
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ---------- 倒计时卡片 ---------- */
.counter-box{
  margin-top:26px;
  padding:26px 16px 22px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.counter-label{
  font-size:13px;
  letter-spacing:4px;
  color:rgba(255,255,255,.85);
  margin-bottom:10px;
}

.counter-days{
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;
  line-height:1.1;
  text-shadow:0 3px 16px rgba(0,0,0,.18);
}
.counter-days .num{
  font-size:64px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  margin-right:4px;
  background:linear-gradient(180deg,#fff,#ffe3ef);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.counter-hms{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:14px;
}
.counter-hms .unit{
  min-width:64px;
  padding:8px 6px;
  border-radius:12px;
  background:rgba(255,255,255,.14);
}
.counter-hms .unit b{
  display:block;
  font-size:20px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
}
.counter-hms .unit span{
  font-size:11px;
  color:rgba(255,255,255,.75);
  letter-spacing:1px;
}

.counter-since{
  margin-top:16px;
  font-size:12px;
  color:rgba(255,255,255,.75);
  letter-spacing:1px;
}
</style>
<style>
/* ============================================================
   二、通用区块标题
   ============================================================ */
.section{margin-bottom:34px;}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 4px 16px;
  font-size:16px;
  font-weight:700;
  letter-spacing:2px;
}
.section-title::after{                 /* 标题右侧装饰线 */
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,.5),transparent);
}
.section-sub{
  margin:-10px 4px 14px;
  font-size:12px;
  color:rgba(255,255,255,.75);
  letter-spacing:1px;
  line-height:1.7;
}

/* ============================================================
   三、地图区块
   ============================================================ */
#mapCard{
  border-radius:var(--radius-card);
  overflow:hidden;
  box-shadow:0 10px 36px rgba(80,20,60,.24);
  background:#eef3f0;
}

#loveMap{
  width:100%;
  height:400px;                        /* 桌面 400px */
}

/* Leaflet 弹窗适配 */
.leaflet-popup-content-wrapper{border-radius:12px;font-family:inherit;}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.7;color:#3d2b3d;}
.leaflet-popup-content b{color:#b0437a;}

/* 距离展示 */
.distance-box{
  margin-top:16px;
  padding:20px 18px;
  border-radius:var(--radius-card);
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  text-align:center;
}
.distance-num{
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 12px rgba(0,0,0,.16);
}
.distance-num small{font-size:14px;font-weight:600;margin-left:4px;}
.distance-tip{
  margin-top:10px;
  font-size:13px;
  line-height:1.8;
  color:rgba(255,255,255,.9);
}
.city-row{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:16px;
  font-size:12px;
  color:rgba(255,255,255,.85);
}
.city-row span{
  padding:6px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
}

/* ============================================================
   四、随机约定
   ============================================================ */
.promise-card{
  position:relative;
  padding:38px 24px 32px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  text-align:center;
  overflow:hidden;
}
/* 装饰星点 */
.promise-card::before{
  content:"✦";
  position:absolute;
  top:16px;left:20px;
  font-size:14px;
  color:rgba(255,255,255,.7);
  animation:twinkle 2.6s ease-in-out infinite;
}
.promise-card::after{
  content:"✦";
  position:absolute;
  bottom:18px;right:22px;
  font-size:12px;
  color:rgba(255,255,255,.6);
  animation:twinkle 3.2s ease-in-out .7s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.85);}
  50%{opacity:1;transform:scale(1.15);}
}

.promise-icon{
  font-size:42px;
  line-height:1;
  margin-bottom:18px;
  display:block;
}

.promise-text{
  font-size:18px;
  line-height:1.95;
  font-weight:600;
  letter-spacing:.5px;
  min-height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-shadow:0 2px 12px rgba(0,0,0,.14);
  animation:fadeIn .45s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* 按钮：触控区 ≥ 44px */
.promise-btn{
  margin-top:24px;
  min-height:50px;
  padding:0 36px;
  border:none;
  border-radius:var(--radius-btn);
  background:#fff;
  color:#d94f86;
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.14);
  transition:transform .15s;
}
.promise-btn:active{transform:scale(.96);}

.promise-count{
  margin-top:16px;
  font-size:12px;
  color:rgba(255,255,255,.72);
  letter-spacing:1px;
}

/* ============================================================
   五、底部
   ============================================================ */
.footer{
  margin-top:44px;
  text-align:center;
  font-size:12px;
  line-height:2;
  color:rgba(255,255,255,.7);
  letter-spacing:1px;
}
.footer .heart{
  display:inline-block;
  animation:beat 1.8s ease-in-out infinite;
}

/* ============================================================
   六、响应式断点（768px / 480px）
   ============================================================ */
@media (max-width:767px){
  #loveMap{height:300px;}              /* 移动端 300px */
  .page{padding-left:16px;padding-right:16px;}
}

@media (max-width:480px){
  .hero-names{font-size:22px;letter-spacing:2px;}
  .hero-names .amp{margin:0 4px;}

  .counter-box{padding:22px 12px 20px;border-radius:20px;}
  .counter-days{font-size:26px;}
  .counter-days .num{font-size:50px;}

  .counter-hms{gap:10px;}
  .counter-hms .unit{min-width:56px;padding:7px 4px;}
  .counter-hms .unit b{font-size:18px;}

  .promise-card{padding:32px 18px 28px;border-radius:20px;}
  .promise-text{font-size:16px;min-height:88px;}
  .promise-icon{font-size:36px;}

  .section-title{font-size:15px;}

  .distance-num{font-size:28px;}
}

/* 尊重系统「减少动态效果」偏好 */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>
<body>

<!-- 爱心飘落层（定位固定，位于内容下层，不阻挡点击） -->
<div id="heartsLayer" aria-hidden="true"></div>

<div class="page">

  <!-- ============ 首屏：名字 + 倒计时 ============ -->
  <header class="hero">
    <div class="hero-heart">💗</div>
    <h1 class="hero-names">王鸿<span class="amp">💗</span>宋星禾</h1>
    <p class="hero-sub" id="heroSub"><span class="type-cursor"></span></p>

    <!-- 在一起天数大号倒计时（每秒刷新） -->
    <div class="counter-box">
      <div class="counter-label">我们已经在一起</div>
      <div class="counter-days"><span class="num" id="daysNum">0</span>天</div>
      <div class="counter-hms">
        <div class="unit"><b id="hoursNum">00</b><span>时</span></div>

  </header>

  <!-- ============ 地图：成都 ↔ 自贡 ============ -->
  <section class="section">

  <!-- ============ 底部 ============ -->
  <footer class="footer">
    <div><span class="heart">💗</span></div>

    <div>从 2026 年 9 月 7 日开始</div>
  </footer>

</div>

<!-- Leaflet 地图库 -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   页面逻辑（纯前端，无任何后端请求）
   ------------------------------------------------------------
   想改内容时，直接搜索下面的「配置区」即可：
   - TOGETHER_DATE：在一起的日期
   - PEOPLE：两个人所在的城市坐标
   - PROMISES：未来小约定的文案
   ============================================================ */

/* ------------------------------------------------------------
   0. 配置区（改这里就能改内容）
   ------------------------------------------------------------ */

/* 在一起的日期：带上 +08:00 时区，保证在任何设备上计算结果一致 */
const TOGETHER_DATE = new Date('2026-09-07T00:00:00+08:00');

/* 两个人 + 各自城市的经纬度（地图标记用；距离由公式实时算出，不写死数字） */
const PEOPLE = {
  wanghong:   { name: '王鸿',   city: '成都', lat: 30.5728, lng: 104.0668 },
  songxinghe: { name: '宋星禾', city: '自贡', lat: 29.3392, lng: 104.7784 }
};

/* 未来小约定：想加就往下加一行，数量不限 */
const PROMISES = [
  '一起去成都的街头走一走，吃一碗你选的红油抄手',
  '等一场雪，拍一张我们同框的雪景照',
  '一起去自贡看一次灯会，牵着手从头逛到尾',
  '找个周末，坐着高铁互相奔赴一次',
  '一起看一部电影，看到一半睡着也没关系',
  '在对方生气的时候，先递一杯温水',
  '一起做一顿饭，难吃也要吃完',
  '每年拍一张合照，存进同一个相册',
  '一起去一次海边，把想说的话说给海浪听',
  '无论多晚，睡前都要说一句「晚安」',
  '吵架不过夜，谁先低头都算赢',
  '一起去逛一次书店，各挑一本送给对方',
  '攒钱去看一次演唱会，站在人群里一起唱',
  '一起过一次生日，蛋糕上写两个人的名字',
  '把想念写下来，装在只有我们知道的地方'
];

/* 首屏打字机轮播的句子 */
const HERO_TEXTS = [
  '欢迎来到我们的小宇宙',
  '成都 ⇄ 自贡，想念一直在路上',
  '每一天都值得记下来'
];

/* ------------------------------------------------------------
   1. 通用小工具
   ------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);

function pad2(n){ return String(n).padStart(2, '0'); }

/* ------------------------------------------------------------
   2. 背景动效：爱心飘落（requestAnimationFrame）
   ------------------------------------------------------------
   移动端粒子数 ≤ 15，保证手机流畅；
   页面切到后台时自动暂停，省电。
   ------------------------------------------------------------ */
function startHearts(){
  const layer = $('heartsLayer');
  if (!layer) return;

  // 尊重系统「减少动态效果」偏好
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const COUNT = isMobile ? 12 : 20;
  const EMOJI = ['💗','💖','💕','💞','♥️'];
  const hearts = [];

  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'fall-heart';
    el.textContent = EMOJI[i % EMOJI.length];
    const size = (isMobile ? 14 : 16) + Math.random() * (isMobile ? 10 : 14);
    el.style.fontSize = size + 'px';
    el.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
    layer.appendChild(el);
    hearts.push({
      el,
      x: Math.random() * 100,                  // 水平位置（vw）
      y: -10 - Math.random() * 100,            // 起始在屏幕上方
      vy: 18 + Math.random() * 34,             // 下落速度 px/s
      sway: 10 + Math.random() * 26,           // 左右摇摆幅度
      phase: Math.random() * Math.PI * 2,      // 摇摆相位
      rot: (Math.random() - 0.5) * 40          // 初始旋转角
    });
  }

  let last = performance.now();
  let paused = false;
  let rafId = null;

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05);   // 限制单帧步长，切后台回来不跳
    last = now;
    const H = window.innerHeight;

    for (const h of hearts){
      h.y += h.vy * dt;
      h.phase += dt * 0.9;
      if (h.y > H + 40){                              // 飘出屏幕 → 回到顶部重生
        h.y = -30 - Math.random() * 120;
        h.x = Math.random() * 100;
        h.vy = 18 + Math.random() * 34;
      }
      const dx = Math.sin(h.phase) * h.sway;
      h.el.style.left = h.x + 'vw';
      h.el.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + h.y.toFixed(1) + 'px,0) rotate(' + h.rot + 'deg)';
    }
    if (!paused) rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  // 切到后台时暂停，省电（手机上很重要）
  document.addEventListener('visibilitychange', () => {
    paused = document.hidden;
    if (!paused){
      last = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  });
}

/* ------------------------------------------------------------
   3. 首屏打字机效果
   ------------------------------------------------------------ */
function startTypewriter(){
  const box = $('heroSub');
  if (!box) return;

  let ti = 0, ci = 0, deleting = false;

  function tick(){
    const full = HERO_TEXTS[ti];
    ci += deleting ? -1 : 1;

    // 重绘：文本 + 光标
    box.innerHTML = '';
    box.appendChild(document.createTextNode(full.slice(0, ci)));
    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    box.appendChild(cursor);

    let delay = deleting ? 45 : 105;
    if (!deleting && ci >= full.length){ delay = 1800; deleting = true; }
    else if (deleting && ci <= 0){
      deleting = false;
      ti = (ti + 1) % HERO_TEXTS.length;
      delay = 350;
    }
    setTimeout(tick, delay);
  }
  tick();
}

/* ------------------------------------------------------------
   4. 在一起天数倒计时（每秒刷新）
   ------------------------------------------------------------ */
function tickCounter(){
  const now = Date.now();
  const diff = now - TOGETHER_DATE.getTime();

  // 若还没到「在一起」的日期，显示 0，不出现负数
  const total = Math.max(diff, 0);
  const sec = Math.floor(total / 1000);

  const days = Math.floor(sec / 86400);
  const hours = Math.floor((sec % 86400) / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  const secs = sec % 60;

  $('daysNum').textContent = String(days);
  $('hoursNum').textContent = pad2(hours);
  $('minutesNum').textContent = pad2(mins);
  $('secondsNum').textContent = pad2(secs);
}

function startCounter(){
  tickCounter();
  setInterval(tickCounter, 1000);

  const y = TOGETHER_DATE.getFullYear();
  const m = pad2(TOGETHER_DATE.getMonth() + 1);
  const d = pad2(TOGETHER_DATE.getDate());
  $('sinceText').textContent = '从 ' + y + ' 年 ' + m + ' 月 ' + d + ' 日 开始，每一秒都算数';
}

/* ------------------------------------------------------------
   5. 地图：Leaflet 标记成都、自贡 + 虚线连接 + Haversine 实测距离
   ------------------------------------------------------------ */

/** Haversine 公式：由两点经纬度实时计算球面直线距离（公里）
 *  不硬编码任何距离数值，坐标改了就自动重算。 */
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;                                    // 地球平均半径（公里）
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

let leafletMap = null;      // 地图实例（只初始化一次）

function initMap(){
  if (leafletMap) return;

  // Leaflet 没加载成功时（网络问题），给一句友好提示而不是白块
  if (!window.L || typeof window.L.map !== 'function'){
    $('mapCard').innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#7a6a7a;font-size:13px;line-height:2">' +
      '地图没能加载出来 🌧<br>检查网络后刷新一下</div>';
    $('distanceNum').textContent = '——';
    return;
  }

  const A = PEOPLE.wanghong;    // 成都
  const B = PEOPLE.songxinghe;  // 自贡

  // 初始化地图（关闭滚轮缩放，避免手机上滑动页面时误触缩放）
  leafletMap = L.map('loveMap', {
    scrollWheelZoom: false,
    zoomControl: true,
    attributionControl: true
  });

  // OpenStreetMap 免费瓦片
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(leafletMap);

  // 自定义爱心标记
  const heartIcon = (emoji) => L.divIcon({
    className: '',
    html: '<div style="font-size:26px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))">' + emoji + '</div>',
    iconSize: [26, 26],
    iconAnchor: [13, 24]
  });

  const m1 = L.marker([A.lat, A.lng], { icon: heartIcon('💗') }).addTo(leafletMap);
  const m2 = L.marker([B.lat, B.lng], { icon: heartIcon('💜') }).addTo(leafletMap);

  m1.bindPopup('<b>' + A.name + '</b><br>' + A.city + '<br>纬度 ' + A.lat + '，经度 ' + A.lng);
  m2.bindPopup('<b>' + B.name + '</b><br>' + B.city + '<br>纬度 ' + B.lat + '，经度 ' + B.lng);

  // 两地之间的虚线
  L.polyline([[A.lat, A.lng], [B.lat, B.lng]], {
    color: '#FF6B9D',
    weight: 3,
    opacity: 0.9,
    dashArray: '8 10',          // 虚线
    lineCap: 'round'
  }).addTo(leafletMap);

  // 视野自动包住两个点
  leafletMap.fitBounds([[A.lat, A.lng], [B.lat, B.lng]], { padding: [40, 40] });

  // 实时算出并展示距离
  const km = haversineKm(A.lat, A.lng, B.lat, B.lng);
  $('distanceNum').innerHTML = km.toFixed(1) + '<small>公里</small>';
  $('distanceTip').textContent = '成都与自贡的直线距离 · 由坐标实时算出';

  // 容器尺寸变化后刷新尺寸（移动端旋转屏幕时会用到）
  window.addEventListener('resize', () => {
    setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 220);
  });
}

/* ------------------------------------------------------------
   6. 随机约定
   ------------------------------------------------------------ */
let lastPromiseIndex = -1;

function rollPromise(){
  // 抽一条与上次不同的（只有一条时不强求）
  let i = lastPromiseIndex;
  if (PROMISES.length > 1){
    while (i === lastPromiseIndex) i = Math.floor(Math.random() * PROMISES.length);
  } else {
    i = 0;
  }
  lastPromiseIndex = i;

  const el = $('promiseText');
  el.style.animation = 'none';
  void el.offsetWidth;                 // 触发重排以重放动画
  el.textContent = PROMISES[i];
  el.style.animation = '';

  $('promiseCount').textContent = '第 ' + (i + 1) + ' 条 · 共 ' + PROMISES.length + ' 条';
}

/* ------------------------------------------------------------
   7. 启动
   ------------------------------------------------------------ */
function boot(){
  startHearts();
  startTypewriter();
  startCounter();

  $('promiseBtn').addEventListener('click', rollPromise);
  rollPromise();                       // 首屏直接抽一条，不用等点击

  // 地图区块进入视野时再初始化：避免首屏加载不必要的瓦片请求，手机上更快
  const mapSection = $('mapCard');
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)){
        initMap();
        io.disconnect();
      }
    }, { rootMargin: '200px' });       // 提前 200px 就开始准备
    io.observe(mapSection);
  } else {
    initMap();                         // 老浏览器直接加载
  }
}

// DOM 就绪后启动
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
