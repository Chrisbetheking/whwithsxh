<script>
/* ============================================================
   whwithsxh · 前端逻辑（四）
   时间线 / 地图（Leaflet + Haversine）/ 随机约定

/* ------------------------------------------------------------
   12. 时间线
   ------------------------------------------------------------ */
async function loadTimeline(){
  const box = $('timelineList');
  box.innerHTML = '<div class="empty-tip" style="margin-left:-30px">正在翻阅我们的回忆…</div>';
  $('timelineEmpty').classList.add('hidden');

  try {
    const { data, error } = await sb
      .from('timeline')
      .select('id,date,title,description,author')
      .order('date', { ascending: true })
      .order('title', { ascending: true });

    if (error) throw error;
    renderTimeline(data || []);
  } catch (e){
    box.innerHTML = '<div class="empty-tip" style="margin-left:-30px">时间线没能加载出来 🌧<br>请检查网络后重试</div>';
  }
}

function renderTimeline(items){
  const box = $('timelineList');

  if (!items.length){
    box.innerHTML = '';
    $('timelineEmpty').classList.remove('hidden');
    return;
  }
  $('timelineEmpty').classList.add('hidden');

  box.innerHTML = items.map((it, i) => {
    const desc = (it.description || '').trim();
    return '' +
      '<div class="tl-item" style="animation-delay:' + Math.min(i * 60, 360) + 'ms">' +
        '<span class="tl-date">' + fmtDay(it.date) + '</span>' +
        '<h3 class="tl-title">' + esc(it.title || '') + '</h3>' +
        (desc ? '<p class="tl-desc">' + esc(desc) + '</p>' : '') +
      '</div>';
  }).join('');
}

/* ---------- 时间线新增（底部抽屉） ---------- */
function openTimelineSheet(){
  const d = new Date();
  $('tlDateInput').value = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  $('tlTitleInput').value = '';
  $('tlDescInput').value = '';
  $('tlSaveHint').textContent = '';

  $('tlSheetMask').classList.remove('hidden');
  $('tlSheet').classList.remove('hidden');
  requestAnimationFrame(() => {
    $('tlSheetMask').classList.add('show');
    $('tlSheet').classList.add('show');
  });
}

function closeTimelineSheet(){
  $('tlSheetMask').classList.remove('show');
  $('tlSheet').classList.remove('show');
  setTimeout(() => {
    $('tlSheetMask').classList.add('hidden');
    $('tlSheet').classList.add('hidden');
  }, 300);
}

async function saveTimeline(){
  const date = $('tlDateInput').value;
  const title = $('tlTitleInput').value.trim();
  const desc = $('tlDescInput').value.trim();
  const hint = $('tlSaveHint');

  if (!date){ hint.textContent = '选一个日期吧'; return; }
  if (!title){ hint.textContent = '给这件事起个标题吧'; return; }

  const btn = $('saveTimelineBtn');
  btn.disabled = true;
  hint.textContent = '正在保存…';

  try {
    const { error } = await sb.from('timeline')
      .insert({ date: date, title: title, description: desc, author: currentUser });
    if (error) throw error;

    closeTimelineSheet();
    showToast('已记下这一天 🕰️');
    await loadTimeline();
  } catch (e){
    hint.textContent = '保存失败，请检查网络后重试';
  } finally {
    btn.disabled = false;
  }
}

/* ------------------------------------------------------------
   13. 地图：Leaflet 标记成都、自贡 + 虚线连接 + Haversine 实测距离
   ------------------------------------------------------------ */
let leafletMap = null;      // 地图实例（只初始化一次）
let didFitMap = false;      // 是否已完成首次视野适配

/** Haversine 公式：由两点的经纬度实时计算球面直线距离（公里）
 *  不硬编码任何距离数值，坐标改了就自动重算。 */
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;                                   // 地球平均半径（公里）
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function initMap(){
  if (leafletMap) return;                              // 避免重复创建
  if (!window.L || typeof window.L.map !== 'function'){
    $('mapCard').innerHTML = '<div class="empty-tip" style="padding:60px 20px;color:#7a6a7a">地图组件没能加载 🌧<br>请检查网络后刷新</div>';
    return;
  }

  const A = PEOPLE.wanghong;    // 成都
  const B = PEOPLE.songxinghe;  // 自贡

  // 初始化地图（禁用滚轮缩放，避免手机上滑动页面时误触缩放）
  leafletMap = L.map('loveMap', {
    scrollWheelZoom: false,
    zoomControl: true,
    attributionControl: true
  });

  // OpenStreetMap 免费瓦片
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(leafletMap);

  // 自定义爱心标记
  const heartIcon = (color) => L.divIcon({
    className: '',
    html: '<div style="font-size:26px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))">' + color + '</div>',
    iconSize: [26, 26],
    iconAnchor: [13, 24]
  });

  const m1 = L.marker([A.lat, A.lng], { icon: heartIcon('💗') }).addTo(leafletMap);
  const m2 = L.marker([B.lat, B.lng], { icon: heartIcon('💜') }).addTo(leafletMap);

  m1.bindPopup('<b>' + A.name + '</b><br>' + A.city + '<br>纬度 ' + A.lat + '，经度 ' + A.lng);
  m2.bindPopup('<b>' + B.name + '</b><br>' + B.city + '<br>纬度 ' + B.lat + '，经度 ' + B.lng);

  // 两地之间的虚线
  L.polyline([[A.lat, A.lng], [B.lat, B.lng]], {
    color: '#FF6B9D',
    weight: 3,
    opacity: 0.9,
    dashArray: '8 10',          // 虚线
    lineCap: 'round'
  }).addTo(leafletMap);

  // 视野自动包住两个点
  leafletMap.fitBounds([[A.lat, A.lng], [B.lat, B.lng]], { padding: [40, 40] });

  // 实时计算并展示距离
  const km = haversineKm(A.lat, A.lng, B.lat, B.lng);
  $('distanceNum').innerHTML = km.toFixed(1) + '<small>公里</small>';
  $('distanceTip').textContent = '成都与自贡的直线距离 · 由坐标实时算出';

  // 容器尺寸变化后刷新（从隐藏切到显示时 Leaflet 需要重算尺寸）
  setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 220);
}

/* ------------------------------------------------------------
   14. 随机约定
   ------------------------------------------------------------ */
const PROMISES = [
  '一起去成都的街头走一走，吃一碗你选的红油抄手',
  '等一场雪，拍一张我们同框的雪景照',
  '一起去自贡看一次灯会，牵着手从头逛到尾',
  '找个周末，坐着高铁互相奔赴一次',
  '一起看一部电影，看到一半睡着也没关系',
  '在对方生气的时候，先递一杯温水',
  '一起做一顿饭，难吃也要吃完',
  '每年拍一张合照，存进同一个相册',
  '一起去一次海边，把想说的话说给海浪听',
  '无论多晚，睡前都要说一句「晚安」',
  '吵架不过夜，谁先低头都算赢',
  '一起去逛一次书店，各挑一本送给对方',
  '攒钱去看一次演唱会，站在人群里一起唱',
  '一起过一次生日，蛋糕上写两个人的名字',
  '把想念写下来，装进这个只属于我们的空间'
];

let lastPromiseIndex = -1;

function rollPromise(){
  // 抽一条与上次不同的（只有一条时不强求）
  let i = lastPromiseIndex;
  if (PROMISES.length > 1){
    while (i === lastPromiseIndex) i = Math.floor(Math.random() * PROMISES.length);
  } else {
    i = 0;
  }
  lastPromiseIndex = i;

  const el = $('promiseText');
  el.style.animation = 'none';
  void el.offsetWidth;                 // 触发重排以重放动画
  el.textContent = PROMISES[i];
  el.style.animation = '';

  $('promiseCount').textContent = '第 ' + (i + 1) + ' 条 · 共 ' + PROMISES.length + ' 条';
}
</script>
