/** 轻提示：底部浮出一条消息，2 秒后自动消失 */
function showToast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

function pad2(n){ return String(n).padStart(2, '0'); }

/** 把日期格式化成「2026年09月07日」 */
function fmtCN(d){
  const y = d.getFullYear();
  return y + '年' + pad2(d.getMonth() + 1) + '月' + pad2(d.getDate()) + '日';
}

/** ISO 字符串 → 「2026年09月07日」（用于信件日期） */
function fmtISO(iso){
  if (!iso) return '——';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? '——' : fmtCN(d);
}

/** 时间线日期（YYYY-MM-DD）→ 「2026年09月07日」，避免时区偏移 */
function fmtDay(str){
  if (!str) return '——';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str);
  return m ? m[1] + '年' + m[2] + '月' + m[3] + '日' : str;
}

/* ------------------------------------------------------------
   2. 背景动效：爱心飘落（requestAnimationFrame）
   移动端粒子数 ≤ 15，保证手机流畅
   ------------------------------------------------------------ */
let heartsRAF = null;

function startHearts(){
  const layer = $('heartsLayer');
  if (!layer) return;
  // 尊重系统「减少动态效果」偏好
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const COUNT = isMobile ? 12 : 20;          // 移动端 ≤ 15 个粒子
  const EMOJI = ['💗','💖','💕','💞','♥️'];
  const hearts = [];

  for (let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'fall-heart';
    el.textContent = EMOJI[i % EMOJI.length];
    const size = (isMobile ? 14 : 16) + Math.random() * (isMobile ? 10 : 14);
    el.style.fontSize = size + 'px';
    el.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
    layer.appendChild(el);
    hearts.push({
      el,
      x: Math.random() * 100,                        // 水平位置（vw）
      y: -10 - Math.random() * 100,                  // 起始在屏幕上方
      vy: 18 + Math.random() * 34,                   // 下落速度 px/s
      sway: 10 + Math.random() * 26,                 // 左右摇摆幅度
      phase: Math.random() * Math.PI * 2,            // 摇摆相位
      rot: (Math.random() - 0.5) * 40                // 初始旋转
    });
  }

  let last = performance.now();
  let paused = false;

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05);   // 限制单帧步长，切后台回来不跳
    last = now;
    const H = window.innerHeight;
    for (const h of hearts){
      h.y += h.vy * dt;
      h.phase += dt * 0.9;
      if (h.y > H + 40){                              // 飘出屏幕 → 回到顶部重生
        h.y = -30 - Math.random() * 120;
        h.x = Math.random() * 100;
        h.vy = 18 + Math.random() * 34;
      }
      const dx = Math.sin(h.phase) * h.sway;
      h.el.style.transform = 'translate3d(' + (dx).toFixed(1) + 'px,' + h.y.toFixed(1) + 'px,0) rotate(' + h.rot + 'deg)';
      h.el.style.left = h.x + 'vw';
    }
    if (!paused) heartsRAF = requestAnimationFrame(frame);
  }
  heartsRAF = requestAnimationFrame(frame);

  // 切到后台时暂停，省电（手机上很重要）
  document.addEventListener('visibilitychange', () => {
    paused = document.hidden;
    if (!paused){ last = performance.now(); heartsRAF = requestAnimationFrame(frame); }
  });
}

/* ------------------------------------------------------------
   3. 登录页打字机效果
   ------------------------------------------------------------ */
const TYPE_TEXTS = ['只属于我们两个人的地方', '想说的话，慢慢写给你', '成都 ⇄ 自贡，也有我们的小宇宙'];
let typeTimer = null;

function startTypewriter(){
  const box = $('loginSub');
  if (!box) return;
  let ti = 0, ci = 0, deleting = false;

  function tick(){
    const full = TYPE_TEXTS[ti];
    ci += deleting ? -1 : 1;
    box.innerHTML = '';
    box.appendChild(document.createTextNode(full.slice(0, ci)));
    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    box.appendChild(cursor);

    let delay = deleting ? 45 : 105;
    if (!deleting && ci >= full.length){ delay = 1600; deleting = true; }
    else if (deleting && ci <= 0){ deleting = false; ti = (ti + 1) % TYPE_TEXTS.length; delay = 350; }
    typeTimer = setTimeout(tick, delay);
  }
  tick();
}
