<style>
/* ============================================================
   七、时间线
   ============================================================ */
.timeline{
  position:relative;
  padding-left:30px;
}
/* 垂直轴线 */
.timeline::before{
  content:"";
  position:absolute;
  left:9px;
  top:6px;
  bottom:6px;
  width:2px;
  border-radius:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35));
}

.tl-item{
  position:relative;
  margin-bottom:18px;
  padding:16px 18px;
  border-radius:var(--radius-card);
  background:rgba(255,255,255,.9);
  color:var(--text);
  box-shadow:var(--shadow);
  animation:tlIn .5s ease both;
}
@keyframes tlIn{
  from{opacity:0;transform:translateX(-10px);}
  to{opacity:1;transform:none;}
}

/* 节点圆点 */
.tl-item::before{
  content:"";
  position:absolute;
  left:-27px;
  top:22px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--pink);
  box-shadow:0 0 0 4px rgba(255,107,157,.22);
}

.tl-date{
  display:inline-block;
  font-size:12px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  background:linear-gradient(135deg,rgba(255,107,157,.14),rgba(166,107,255,.14));
  color:#b0437a;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  margin-bottom:9px;
}

.tl-title{
  font-size:16px;
  font-weight:700;
  letter-spacing:.5px;
  margin-bottom:6px;
  word-break:break-word;
}

.tl-desc{
  font-size:14px;
  line-height:1.75;
  color:#6d5d6d;
  white-space:pre-wrap;
  word-break:break-word;
}

/* ============================================================
   八、地图
   ============================================================ */
#mapCard{
  border-radius:var(--radius-card);
  overflow:hidden;
  box-shadow:0 10px 36px rgba(80,20,60,.24);
  background:#eef3f0;
}

#loveMap{
  width:100%;
  height:400px;                    /* 桌面 400px */
}

/* Leaflet 弹窗适配深色主题 */
.leaflet-popup-content-wrapper{border-radius:12px;font-family:inherit;}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.7;color:#3d2b3d;}
.leaflet-popup-content b{color:#b0437a;}

.distance-box{
  margin-top:16px;
  padding:18px;
  border-radius:var(--radius-card);
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  text-align:center;
}
.distance-num{
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 12px rgba(0,0,0,.16);
}
.distance-num small{font-size:14px;font-weight:600;margin-left:4px;}
.distance-tip{
  margin-top:10px;
  font-size:13px;
  line-height:1.8;
  color:rgba(255,255,255,.9);
}
.city-row{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:14px;
  font-size:12px;
  color:rgba(255,255,255,.82);
}
.city-row span{padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);}

/* ============================================================
   九、随机约定
   ============================================================ */
.promise-card{
  position:relative;
  padding:34px 24px 30px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  text-align:center;
  overflow:hidden;
}
.promise-card::before{             /* 装饰星点 */
  content:"✦";
  position:absolute;
  top:14px;left:18px;
  font-size:14px;
  color:rgba(255,255,255,.7);
  animation:twinkle 2.6s ease-in-out infinite;
}
.promise-card::after{
  content:"✦";
  position:absolute;
  bottom:16px;right:20px;
  font-size:12px;
  color:rgba(255,255,255,.6);
  animation:twinkle 3.2s ease-in-out .7s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.85);}
  50%{opacity:1;transform:scale(1.15);}
}

.promise-icon{font-size:40px;line-height:1;margin-bottom:16px;display:block;}

.promise-text{
  font-size:18px;
  line-height:1.9;
  font-weight:600;
  letter-spacing:.5px;
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-shadow:0 2px 12px rgba(0,0,0,.14);
  animation:fadeIn .45s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.promise-btn{
  margin-top:22px;
  min-height:48px;
  padding:0 32px;
  border:none;
  border-radius:var(--radius-btn);
  background:#fff;
  color:#d94f86;
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.14);
  transition:transform .15s;
}
.promise-btn:active{transform:scale(.96);}

.promise-count{
  margin-top:14px;
  font-size:12px;
  color:rgba(255,255,255,.7);
  letter-spacing:1px;
}

/* ============================================================
   十、氛围动效：爱心飘落
   ============================================================ */
#heartsLayer{
  position:fixed;
  inset:0;
  z-index:0;                       /* 在内容之下 */
  pointer-events:none;             /* 不挡点击 */
  overflow:hidden;
}

.fall-heart{
  position:absolute;
  top:-32px;
  will-change:transform,opacity;
  user-select:none;
}

/* ============================================================
   十一、全局加载 & 轻提示
   ============================================================ */
#bootLoading{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:var(--grad);
  color:#fff;
  font-size:14px;
  letter-spacing:2px;
  transition:opacity .3s;
}
#bootLoading.hide{opacity:0;pointer-events:none;}

.spinner{
  width:34px;height:34px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

#toast{
  position:fixed;
  left:50%;
  bottom:calc(32px + env(safe-area-inset-bottom));
  z-index:140;
  transform:translate(-50%,20px);
  padding:12px 22px;
  border-radius:999px;
  background:rgba(45,15,35,.86);
  color:#fff;
  font-size:13px;
  letter-spacing:1px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  max-width:86vw;
  text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* 服务不可用遮罩 */
#offlineMask{
  position:fixed;
  inset:0;
  z-index:130;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:28px;
  background:var(--grad);
  color:#fff;
  text-align:center;
  font-size:14px;
  line-height:1.9;
  letter-spacing:1px;
}

/* ============================================================
   十二、响应式断点（768px / 480px）
   ============================================================ */
@media (max-width:767px){
  /* 地图高度移动端 300px */
  #loveMap{height:300px;}

  /* 信纸宽度：移动端 calc(100% - 32px) */
  .paper{max-width:none;width:calc(100% - 32px);}

  .counter-days{font-size:28px;}
  .counter-days .num{font-size:52px;}

  .entry-grid{gap:12px;}
  .entry-card{min-height:104px;padding:16px 14px;}
}

@media (max-width:480px){
  .login-card{padding:32px 22px 26px;border-radius:20px;}
  .login-title{font-size:23px;}

  #viewHome{padding-left:16px;padding-right:16px;}

  .counter-box{padding:20px 12px 18px;border-radius:20px;}
  .counter-days .num{font-size:46px;}

  .counter-hms{gap:10px;}
  .counter-hms .unit{min-width:54px;padding:7px 4px;}
  .counter-hms .unit b{font-size:18px;}

  .entry-card .ico{font-size:24px;}
  .entry-card .name{font-size:15px;}

  .sub-title{font-size:17px;}
  .paper-head{padding:22px 20px 18px;}
  .paper-title{font-size:19px;}
  .paper-body{padding:20px 20px 22px;}
  .paper-content{font-size:16px;line-height:1.8;}

  .timeline{padding-left:26px;}
  .tl-item{padding:14px 16px;}

  .promise-text{font-size:16px;}
}

/* 减少动画偏好（无障碍） */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
