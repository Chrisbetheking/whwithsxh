<script>
/* ============================================================
   whwithsxh · 前端逻辑（二）
   登录 / Session 管理（7 天有效期）/ 退出登录
   ============================================================ */

/* ------------------------------------------------------------
   4. Supabase 客户端初始化
   ------------------------------------------------------------ */
function initSupabase(){
  if (!window.supabase || typeof window.supabase.createClient !== 'function'){
    // CDN 加载失败：给出明确提示，而不是白屏
    $('bootLoading').innerHTML =
      '<div style="padding:0 28px;text-align:center;line-height:2">' +
      '网络好像不太顺畅 🌧<br>没能加载到必要的组件<br>请检查网络后刷新页面</div>';
    return false;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: {
      persistSession: true,        // 会话写入 localStorage，实现「下次自动登录」
      autoRefreshToken: true,      // 自动续期 access token
      detectSessionInUrl: false    // 本站不做邮件魔法链接登录
    }
  });
  return true;
}

/* ------------------------------------------------------------
   5. Session 管理
   ------------------------------------------------------------
   双层有效期：
   a) Supabase 自身的会话（自动续期，只要常来就不会掉）
   b) 本站策略：从登录那一刻算起，最多 7 天；超过后强制重新输密码
   ------------------------------------------------------------ */
function sessionAgeMs(){
  const t = store.get(LS_LOGIN_AT);
  if (!t) return Infinity;
  const n = parseInt(t, 10);
  return isNaN(n) ? Infinity : (Date.now() - n);
}

function isSessionExpired(){
  return sessionAgeMs() > SESSION_MAX_MS;
}

/** 记录本次登录时间与登录身份 */
function markLogin(email){
  store.set(LS_LOGIN_AT, String(Date.now()));
  store.set(LS_EMAIL, email);
  currentUser = email.indexOf('songxinghe') === 0 ? 'songxinghe' : 'wanghong';
}

/** 用 Supabase 查一次当前会话是否仍然有效（服务器侧校验）*/
async function hasValidSupabaseSession(){
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) return null;
    const s = data && data.session;
    if (!s || !s.user) return null;
    if (s.expires_at && (s.expires_at * 1000) < Date.now() - 60000){
      // access token 已过期且未能续期
      return null;
    }
    return s;
  } catch (e){ return null; }
}

/** 启动时决定：直接进主页，还是回到登录页 */
async function restoreSession(){
  // 先做本地 7 天判定，避免不必要的网络请求
  if (isSessionExpired()){
    await clearSession();
    return false;
  }
  const s = await hasValidSupabaseSession();
  if (!s){
    await clearSession();
    return false;
  }
  // 服务器会话有效：按邮箱恢复身份
  const email = (s.user && s.user.email) || store.get(LS_EMAIL) || '';
  currentUser = email.indexOf('songxinghe') === 0 ? 'songxinghe' : 'wanghong';
  // 若本地没有登录时间戳（例如换了浏览器），补记一次
  if (!store.get(LS_LOGIN_AT)) store.set(LS_LOGIN_AT, String(Date.now()));
  return true;
}

/** 清空登录状态 */
async function clearSession(){
  store.del(LS_LOGIN_AT);
  store.del(LS_EMAIL);
  try { await sb.auth.signOut(); } catch (e) {}
}

/* ------------------------------------------------------------
   6. 登录动作
   ------------------------------------------------------------
   页面只有一个密码框。由于 Supabase 只能在服务器端校验密码，
   这里用「同一个密码依次尝试两个账号」的方式实现：
   任一成功即为登录成功；两个都失败则提示密码不正确。
   ------------------------------------------------------------ */
let loggingIn = false;

async function doLogin(){
  if (loggingIn) return;
  const pwd = ($('loginInput').value || '').trim();
  const errEl = $('loginError');
  errEl.classList.remove('show');

  if (!pwd){
    errEl.textContent = '请输入密码';
    errEl.classList.add('show');
    return;
  }

  loggingIn = true;
  const btn = $('loginBtn');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '正 在 进 入…';

  try {
    for (const email of LOGIN_EMAILS){
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
      if (!error && data && data.session){
        // 命中：记录登录时间（7 天有效期的起点）
        markLogin(email);
        $('loginInput').value = '';
        await enterApp();
        return;
      }
      // 密码错误 / 邮箱不存在：静默继续尝试下一个账号
    }
    // 两个账号都失败
    errEl.textContent = '密码不正确，再试一次';
    errEl.classList.add('show');
  } catch (e){
    errEl.textContent = '网络开小差了，稍后再试';
    errEl.classList.add('show');
  } finally {
    loggingIn = false;
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* ------------------------------------------------------------
   7. 退出登录
   ------------------------------------------------------------ */
async function doLogout(){
  if (!confirm('确定要退出吗？')) return;
  await clearSession();
  stopCounter();
  startTypewriter();
  showView('viewLogin');
  showToast('已退出，下次再来 💗');
}

/** 定时检查 7 天是否到期（页面前台停留很久的情况）*/
function watchSessionExpiry(){
  clearInterval(sessionTimer);
  sessionTimer = setInterval(async () => {
    if (!isSessionExpired()) return;
    clearInterval(sessionTimer);
    await clearSession();
    stopCounter();
    showView('viewLogin');
    alert('登录已超过 7 天，为了安全请重新输入密码');
  }, 60 * 1000);
}
</script>
